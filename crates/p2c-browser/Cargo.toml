[package]
name = "p2c-browser"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
p2c-core.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tracing.workspace = true
# Pinned: the CEF binary distribution must match this exact version.
cef = { version = "=156.6.0", default-features = false }

[dev-dependencies]
p2c-overlay = { path = "../p2c-overlay" }
serde_json = "1"
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
p2c-d3d.workspace = true

# CEF re-launches the current executable as helper processes with Chromium
# flags, which the libtest harness would reject, so these tests own `main`.
[[test]]
name = "render"
harness = false
