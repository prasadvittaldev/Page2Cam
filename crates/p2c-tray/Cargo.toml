[package]
name = "p2c-tray"
edition.workspace = true
version.workspace = true
license.workspace = true

# Tray core logic. The modules here are platform-free (tested on any OS);
# the Windows shell lives under `win/` (cfg(windows)).
[dependencies]
p2c-admin.workspace = true
p2c-shm = { path = "../p2c-shm" }
p2c-core.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serde_json = "1"
