<style>
  .cl{position:absolute;inset:0;display:flex;flex-direction:column;padding:4vh;border-radius:2.5vh;border-top:1.2vh solid var(--accent)}
  .theme-minimal .cl{border-top-color:transparent}
  .cl .hd{display:flex;align-items:baseline;gap:2vh;margin-bottom:2.5vh;flex:none;min-width:0}
  .cl h1{margin:0;font-size:8vh;font-weight:700;flex:1;min-width:0}
  .cl .cnt{flex:none;font-size:5.5vh;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
  .cl ul{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.3em;font-size:var(--fs,6vh)}
  .cl li{display:flex;align-items:center;gap:.6em;padding:.2em .2em;min-width:0;flex:none;transition:color .6s}
  .cl .b{flex:none;width:1.25em;height:1.25em;border-radius:.25em;border:.12em solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85em;font-weight:800;color:#fff;transition:background-color .6s,border-color .6s}
  .cl .t{flex:1;min-width:0}
  .cl li.done{color:var(--muted)}
  .cl li.done .b{background:var(--accent);border-color:var(--accent)}
  .theme-minimal .cl li.done .b{background:rgba(255,255,255,.85);border-color:#fff;color:#111}
</style>
<div class="cl p2c-panel"><div class="hd" id="hd"><h1 class="p2c-ellipsis" id="h"></h1><div class="cnt" id="cnt"></div></div><ul id="list"></ul></div>
<script>
function isDone(v) {
  return /^\s*(yes|y|1|true|done|x|✓|✔)\s*$/i.test(String(v === undefined || v === null ? "" : v));
}
P2C.onParams(function (p) {
  var rows = Array.isArray(p.items) ? p.items : [];
  var list = P2C.$("#list");
  var doneCount = 0;
  rows.forEach(function (r) { if (isDone(r[1])) doneCount++; });
  P2C.text(P2C.$("#h"), p.title);
  P2C.text(P2C.$("#cnt"), doneCount + " / " + rows.length);
  P2C.show(P2C.$("#cnt"), !!p.show_count && rows.length > 0);
  P2C.show(P2C.$("#hd"), !!p.title || (!!p.show_count && rows.length > 0));
  var room = p.title ? 74 : 86;
  list.style.setProperty("--fs", Math.max(2.5, Math.min(6.5, room / Math.max(rows.length, 1) / 1.9)) + "vh");
  while (list.children.length > rows.length) list.removeChild(list.lastChild);
  rows.forEach(function (r, i) {
    var li = list.children[i];
    if (!li) {
      li = P2C.el("li", "", null, list);
      P2C.el("span", "b", "", li);
      P2C.el("span", "t p2c-ellipsis", "", li);
    }
    var d = isDone(r[1]);
    li.className = d ? "done" : "";
    P2C.text(li.children[0], d ? "✓" : "");
    P2C.text(li.children[1], r[0]);
  });
});
</script>
