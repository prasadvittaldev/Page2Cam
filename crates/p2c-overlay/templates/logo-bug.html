<style>
  .lg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .lg img{max-width:100%;max-height:100%;object-fit:contain}
</style>
<div class="lg"><img id="im" alt=""></div>
<script>
P2C.onParams(function (p) {
  var im = P2C.$("#im");
  P2C.img(im, p.image);
  var o = P2C.num(p.opacity);
  if (!isFinite(o)) o = 0.85;
  im.style.opacity = String(Math.max(0.2, Math.min(1, o)));
});
</script>
