<style>
  .st{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;border-radius:3vh}
  .st h1{margin:0;font-weight:700;flex:none}
  .row{display:flex;min-height:0;min-width:0}
  .s{position:relative;min-width:0}
  .c{position:relative;z-index:1;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
     background:var(--bg);color:var(--muted);border:.12em solid var(--line);font-variant-numeric:tabular-nums;transition:background-color .6s,border-color .6s,color .6s}
  .s .l{color:var(--muted);transition:color .6s}
  .s.done .c{background:var(--accent);border-color:var(--accent);color:#fff}
  .s.cur .c{background:#fff;border-color:var(--accent);color:#0d1b2a}
  .s.done .l{color:var(--fg)}
  .s.cur .l{color:var(--fg);font-weight:700}
  .s+.s::before{content:"";position:absolute;z-index:0;background:var(--line);transition:background-color .6s}
  .s.done::before,.s.cur::before{background:var(--accent)}
  .theme-minimal .s.done .c{background:rgba(255,255,255,.85);border-color:#fff;color:#111}
  .theme-minimal .s.cur .c{background:rgba(255,255,255,.22);border-color:#fff;color:#fff}
  .theme-minimal .s.done::before,.theme-minimal .s.cur::before{background:#fff}

  /* horizontal: a row */
  .st.h{padding:6vh 2vh}
  .st.h h1{font-size:14vh;text-align:center;margin-bottom:3vh}
  .st.h .row{flex-direction:row}
  .st.h .s{flex:1;display:flex;flex-direction:column;align-items:center}
  .st.h .c{width:2em;height:2em;font-size:15vh}
  .st.h .l{margin-top:3vh;font-size:16vh;max-width:94%;text-align:center}
  .st.h .s+.s::before{top:15vh;right:50%;width:100%;height:1.6vh;margin-top:-.8vh}

  /* vertical: a column */
  .st.v{justify-content:flex-start;padding:4vh 4vh}
  .st.v h1{font-size:7vh;margin-bottom:2vh}
  .st.v .row{flex-direction:column;flex:1;font-size:var(--fs,6vh)}
  .st.v .s{display:flex;flex-direction:row;align-items:center;gap:.6em;padding:.35em 0}
  .st.v .c{width:1.8em;height:1.8em;font-size:.8em}
  .st.v .l{flex:1;min-width:0}
  .st.v .s+.s::before{left:.66em;width:.12em;bottom:50%;height:100%}
</style>
<div class="st p2c-panel h" id="st"><h1 class="p2c-ellipsis" id="h"></h1><div class="row" id="row"></div></div>
<script>
P2C.onParams(function (p) {
  var root = P2C.$("#st");
  var vert = p.layout === "vertical";
  root.classList.toggle("v", vert);
  root.classList.toggle("h", !vert);
  P2C.text(P2C.$("#h"), p.title);
  P2C.show(P2C.$("#h"), !!p.title);
  var steps = Array.isArray(p.steps) ? p.steps : [];
  var cur = Math.round(P2C.num(p.current));
  if (!isFinite(cur)) cur = 0;
  var row = P2C.$("#row");
  var room = p.title ? 80 : 90;
  row.style.setProperty("--fs", Math.max(2.5, Math.min(7, room / Math.max(steps.length, 1) / 2)) + "vh");
  while (row.children.length > steps.length) row.removeChild(row.lastChild);
  steps.forEach(function (name, i) {
    var s = row.children[i];
    if (!s) {
      s = P2C.el("div", "s", null, row);
      P2C.el("div", "c", "", s);
      P2C.el("div", "l p2c-ellipsis", "", s);
    }
    var n = i + 1;
    var done = cur > 0 && n < cur;
    s.className = "s" + (done ? " done" : (n === cur ? " cur" : ""));
    P2C.text(s.children[0], done ? "✓" : n);
    P2C.text(s.children[1], name);
  });
});
</script>
