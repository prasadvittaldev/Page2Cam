<style>
  .cap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .cap .who{max-width:90%;padding:0 6vh;border-radius:4vh 4vh 0 0;background:var(--accent);color:#fff;font-size:14vh;font-weight:700;line-height:1.3;text-shadow:none}
  .theme-minimal .cap .who{color:#000}
  .cap .t{max-width:100%;padding:2.5vh 6vh;border-radius:4vh;background:rgba(0,0,0,.76);color:#fff;font-size:28vh;font-weight:600;line-height:1.25;text-align:center;text-shadow:none;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
</style>
<div class="cap"><div class="who p2c-ellipsis" id="who"></div><div class="t" id="t"></div></div>
<script>
P2C.onParams(function (p) {
  P2C.text(P2C.$("#t"), p.text);
  P2C.show(P2C.$("#t"), !!p.text);
  P2C.text(P2C.$("#who"), p.speaker);
  P2C.show(P2C.$("#who"), !!p.speaker);
});
</script>
