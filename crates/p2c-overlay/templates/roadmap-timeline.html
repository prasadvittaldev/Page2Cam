<style>
  .rm{position:absolute;inset:0;display:flex;align-items:center;gap:3vh;padding:4vh 4vh;border-radius:2.5vh;border-left:2vh solid var(--accent)}
  .theme-minimal .rm{border-left-color:transparent}
  .rm h1{flex:0 1 auto;margin:0;max-width:22%;font-size:13vh;font-weight:800;line-height:1.1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .rm .track{flex:1;min-width:0;height:100%;display:flex}
  .ms{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ms .when{font-size:10vh;color:var(--muted);font-weight:600;max-width:96%;font-variant-numeric:tabular-nums}
  .ms .dw{position:relative;width:100%;height:20vh;margin:2vh 0;flex:none}
  .ms .seg{position:absolute;top:50%;height:1vh;margin-top:-.5vh;background:var(--line)}
  .ms .seg.l{left:0;right:50%}.ms .seg.r{left:50%;right:0}
  .ms .seg.on{background:var(--accent)}
  .theme-minimal .ms .seg.on{background:#fff}
  .ms .dot{position:absolute;left:50%;top:50%;width:11vh;height:11vh;margin:-5.5vh 0 0 -5.5vh;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7vh;font-weight:800;color:#fff;text-shadow:none}
  .ms.done .dot{background:var(--accent)}
  .ms.now .dot{width:16vh;height:16vh;margin:-8vh 0 0 -8vh;background:var(--accent);border:1.6vh solid var(--fg)}
  .ms.next .dot{background:var(--bg);border:1vh solid var(--fg)}
  .ms.later .dot{background:var(--bg);border:1vh dashed var(--muted)}
  .theme-minimal .ms.done .dot,.theme-minimal .ms.now .dot{background:#fff;color:#111}
  .theme-minimal .ms.now .dot{border-color:rgba(255,255,255,.45)}
  .theme-minimal .ms.next .dot,.theme-minimal .ms.later .dot{background:rgba(0,0,0,.35)}
  .ms .ring{position:absolute;left:50%;top:50%;width:16vh;height:16vh;margin:-8vh 0 0 -8vh;border-radius:50%;border:.8vh solid var(--accent);animation:rmPulse 3.2s ease-out infinite}
  @keyframes rmPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
  .ms .lbl{font-size:12vh;font-weight:600;max-width:96%}
  .ms.now .lbl{font-weight:800}
  .ms.later .lbl{color:var(--muted)}
</style>
<div class="rm p2c-panel"><h1 id="h"></h1><div class="track" id="track"></div></div>
<script>
P2C.onParams(function (p) {
  P2C.text(P2C.$("#h"), p.title);
  P2C.show(P2C.$("#h"), !!p.title);
  var ms = (p.milestones || []).map(function (r) {
    var st = String(r[2] === undefined || r[2] === null ? "" : r[2]).trim().toLowerCase();
    if (st !== "done" && st !== "now" && st !== "later") st = "next";
    return { label: String(r[0] === undefined || r[0] === null ? "" : r[0]), when: String(r[1] === undefined || r[1] === null ? "" : r[1]), st: st };
  }).filter(function (m) { return m.label.trim() || m.when.trim(); });
  var cur = -1;
  ms.forEach(function (m, i) { if (m.st === "done" || m.st === "now") cur = i; });
  var track = P2C.clear(P2C.$("#track"));
  ms.forEach(function (m, i) {
    var col = P2C.el("div", "ms " + m.st, null, track);
    P2C.el("div", "when p2c-ellipsis", m.when || " ", col);
    var dw = P2C.el("div", "dw", null, col);
    if (i > 0) P2C.el("div", "seg l" + (i <= cur ? " on" : ""), null, dw);
    if (i < ms.length - 1) P2C.el("div", "seg r" + (i < cur ? " on" : ""), null, dw);
    if (m.st === "now") P2C.el("div", "ring", null, dw);
    P2C.el("div", "dot", m.st === "done" ? "✓" : "", dw);
    P2C.el("div", "lbl p2c-ellipsis", m.label || " ", col);
  });
});
</script>
