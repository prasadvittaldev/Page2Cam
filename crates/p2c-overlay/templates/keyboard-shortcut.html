<style>
  .ks{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:6vh 4vw;border-radius:3vh;border-bottom:3vh solid var(--accent)}
  .theme-minimal .ks{border-bottom-color:transparent}
  .ks .keys{display:flex;align-items:center;justify-content:center;gap:.3em;max-width:100%;min-width:0}
  .ks .key{flex:0 1 auto;min-width:1.5em;max-width:100%;padding:.12em .45em .2em;border-radius:.22em;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    color:#1c2430;text-shadow:none;background:linear-gradient(#ffffff,#dde3ea);border:.04em solid #b9c2cd;box-shadow:inset 0 -.1em 0 #b3bcc8,0 .07em .16em rgba(0,0,0,.45)}
  .ks .plus{flex:none;color:var(--muted);font-weight:600;font-size:.75em}
  .ks .cap{font-size:17vh;color:var(--fg);max-width:100%;text-align:center}
</style>
<div class="ks p2c-panel"><div class="keys" id="keys"></div><div class="cap p2c-ellipsis" id="cap"></div></div>
<script>
var lastKs = null;
function drawKeys(p) {
  var keys = (p.keys || []).map(function (k) { return String(k).trim(); }).filter(function (k) { return k; });
  var box = P2C.clear(P2C.$("#keys"));
  keys.forEach(function (k, i) {
    if (i > 0) P2C.el("span", "plus", "+", box);
    P2C.el("span", "key", k, box);
  });
  P2C.text(P2C.$("#cap"), p.caption);
  P2C.show(P2C.$("#cap"), !!p.caption);
  var H = window.innerHeight || 150, W = window.innerWidth || 600;
  var ems = 0;
  keys.forEach(function (k) { ems += Math.max(1.5, k.length * 0.62 + 0.9) + 0.3; });
  ems += Math.max(0, keys.length - 1) * 1.05;
  var fs = Math.min(H * (p.caption ? 0.34 : 0.48), (W * 0.86) / Math.max(1, ems));
  box.style.fontSize = Math.max(6, fs).toFixed(1) + "px";
}
P2C.onParams(function (p) { lastKs = p; drawKeys(p); });
window.addEventListener("resize", function () { if (lastKs) drawKeys(lastKs); });
</script>
