<style>
  .sc{position:absolute;inset:0;display:flex;flex-direction:column;border-radius:2vh;overflow:hidden}
  .sc .band{flex:none;display:flex;align-items:center;gap:2.5vh;padding:3vh 3.5vh;color:#fff;background:#238636;text-shadow:none}
  .sc .ico{flex:none;width:6vh;height:6vh;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;font-size:4vh;font-weight:900;color:#238636}
  .sc .bt{flex:1;min-width:0}
  .sc .svc{font-size:2.8vh;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
  .sc .hl{font-size:5vh;font-weight:800}
  .sc .body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.8em;padding:1em 1.2em}
  .sc .inc{font-weight:700;font-size:1.15em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sc .ups{display:flex;flex-direction:column}
  .sc .up{position:relative;padding:0 0 .7em 1.4em;border-left:.15em solid var(--line);margin-left:.3em}
  .sc .up:last-child{border-left-color:transparent;padding-bottom:0}
  .sc .up::before{content:"";position:absolute;left:-.43em;top:.3em;width:.7em;height:.7em;border-radius:50%;background:var(--muted)}
  .sc .up.first::before{background:var(--sc)}
  .sc .tm{font-family:var(--mono);font-size:.8em;color:var(--muted)}
  .sc .tx{line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sc .comps{display:flex;flex-direction:column;border-top:.12em solid var(--line);padding-top:.6em;gap:.35em}
  .sc .cp{display:flex;align-items:center;gap:.6em;min-width:0}
  .sc .cp .nm{flex:1;min-width:0}
  .sc .cp .cs{flex:none;font-size:.82em;color:var(--muted);display:flex;align-items:center;gap:.4em}
  .sc .cp .cs::before{content:"";width:.7em;height:.7em;border-radius:50%;background:currentColor}
</style>
<div class="sc p2c-panel"><div class="band" id="band"><div class="ico" id="ico"></div><div class="bt"><div class="svc p2c-ellipsis" id="svc"></div><div class="hl p2c-ellipsis" id="hl"></div></div></div><div class="body" id="body"><div class="inc" id="inc"></div><div class="ups" id="ups"></div><div class="comps" id="comps"></div></div></div>
<script>
var STATUS = {
  "operational": { c: "#238636", lc: "#3fb950", t: "All systems operational", s: "Operational", i: "✓" },
  "degraded": { c: "#b7791f", lc: "#e3b341", t: "Degraded performance", s: "Degraded", i: "!" },
  "partial-outage": { c: "#d15704", lc: "#f0883e", t: "Partial outage", s: "Partial outage", i: "!" },
  "major-outage": { c: "#c93c37", lc: "#f85149", t: "Major outage", s: "Major outage", i: "✕" },
  "maintenance": { c: "#1f6feb", lc: "#58a6ff", t: "Scheduled maintenance", s: "Maintenance", i: "i" }
};
function statusOf(v) {
  var s = String(v === undefined || v === null ? "" : v).trim().toLowerCase().replace(/[\s_]+/g, "-");
  if (s === "ok" || s === "up" || s === "operational") return "operational";
  if (s === "partial" || s === "partial-outage") return "partial-outage";
  if (s === "major" || s === "major-outage" || s === "down" || s === "outage") return "major-outage";
  if (STATUS[s]) return s;
  return "";
}
function cellText(v) { return String(v === undefined || v === null ? "" : v); }
P2C.onParams(function (p) {
  var st = STATUS[p.status] || STATUS.operational;
  var band = P2C.$("#band"), ico = P2C.$("#ico");
  band.style.background = st.c;
  ico.style.color = st.c;
  P2C.text(ico, st.i);
  P2C.$(".sc").style.setProperty("--sc", st.lc);
  P2C.text(P2C.$("#svc"), p.service);
  P2C.show(P2C.$("#svc"), !!p.service);
  P2C.text(P2C.$("#hl"), p.headline || st.t);
  P2C.text(P2C.$("#inc"), p.incident);
  P2C.show(P2C.$("#inc"), !!p.incident);

  var ups = (p.updates || []).filter(function (r) { return cellText(r[0]).trim() || cellText(r[1]).trim(); });
  var box = P2C.clear(P2C.$("#ups"));
  ups.forEach(function (r, i) {
    var u = P2C.el("div", "up" + (i === 0 ? " first" : ""), null, box);
    P2C.el("div", "tm", cellText(r[0]), u);
    P2C.el("div", "tx", cellText(r[1]), u);
  });
  P2C.show(box, ups.length > 0);

  var comps = (p.components || []).filter(function (r) { return cellText(r[0]).trim(); });
  var cb = P2C.clear(P2C.$("#comps"));
  comps.forEach(function (r) {
    var row = P2C.el("div", "cp", null, cb);
    P2C.el("div", "nm p2c-ellipsis", cellText(r[0]), row);
    var k = statusOf(r[1]);
    var cs = P2C.el("div", "cs", k ? STATUS[k].s : cellText(r[1]), row);
    if (k) cs.style.color = STATUS[k].lc;
  });
  P2C.show(cb, comps.length > 0);

  var weight = (p.incident ? 2.6 : 0) + ups.length * 3.2 + (comps.length ? 1 + comps.length * 1.35 : 0);
  P2C.$("#body").style.fontSize = Math.min(3.6, 66 / Math.max(1, weight)).toFixed(2) + "vh";
});
</script>
