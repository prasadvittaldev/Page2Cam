<style>
  .pr{position:absolute;inset:0;display:flex;flex-direction:column;padding:4vh 4.5vh;border-radius:2.5vh;border-top:1.2vh solid var(--accent)}
  .theme-minimal .pr{border-top-color:transparent}
  .pr .tag{flex:none;font-size:3.8vh;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .theme-minimal .pr .tag{color:var(--muted)}
  .pr h1{margin:1vh 0 3vh;flex:none;font-size:7.4vh;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  .pr .opts{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.75em;font-size:var(--fs,5vh)}
  .pr .o{flex:none;min-width:0}
  .pr .top{display:flex;align-items:baseline;gap:.6em;min-width:0}
  .pr .lb{flex:1;min-width:0;transition:color .6s}
  .pr .pc{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
  .pr .tr{margin-top:.3em;height:.55em;border-radius:.275em;background:var(--line);overflow:hidden}
  .pr .b{height:100%;width:0;border-radius:.275em;background:rgba(255,255,255,.45);transition:background-color .6s}
  .pr .o.lead .lb{font-weight:700}
  .pr .o.lead .b{background:var(--accent)}
  .theme-minimal .pr .o.lead .b{background:#fff}
  .pr .tot{flex:none;margin-top:2.5vh;font-size:4vh;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
<div class="pr p2c-panel"><div class="tag">Poll</div><h1 id="q"></h1><div class="opts" id="opts"></div><div class="tot" id="tot"></div></div>
<script>
var shown = [];
var shownTotal = NaN;
P2C.onParams(function (p) {
  P2C.text(P2C.$("#q"), p.question);
  var rows = Array.isArray(p.options) ? p.options : [];
  var votes = rows.map(function (r) { var n = P2C.num(r[1]); return isFinite(n) && n > 0 ? n : 0; });
  var total = votes.reduce(function (a, b) { return a + b; }, 0);
  var best = -1, bestV = 0;
  votes.forEach(function (v, i) { if (v > bestV) { bestV = v; best = i; } });
  var box = P2C.$("#opts");
  box.style.setProperty("--fs", Math.max(2.4, Math.min(5.2, 54 / Math.max(rows.length, 1) / 2.8)) + "vh");
  while (box.children.length > rows.length) box.removeChild(box.lastChild);
  shown.length = Math.min(shown.length, rows.length);
  rows.forEach(function (r, i) {
    var o = box.children[i];
    if (!o) {
      o = P2C.el("div", "o", null, box);
      var top = P2C.el("div", "top", null, o);
      P2C.el("span", "lb p2c-ellipsis", "", top);
      P2C.el("span", "pc", "", top);
      var tr = P2C.el("div", "tr", null, o);
      P2C.el("div", "b", null, tr);
    }
    o.className = "o" + (i === best ? " lead" : "");
    P2C.text(o.children[0].children[0], r[0]);
    var pcEl = o.children[0].children[1];
    var bar = o.children[1].children[0];
    var target = total > 0 ? (votes[i] / total) * 100 : 0;
    var from = isFinite(shown[i]) ? shown[i] : 0;
    P2C.tween("opt" + i, from, target, 900, function (v) {
      shown[i] = v;
      bar.style.width = v.toFixed(2) + "%";
      P2C.text(pcEl, Math.round(v) + "%");
    });
  });
  var tot = P2C.$("#tot");
  P2C.show(tot, !!p.show_votes);
  P2C.tween("total", isFinite(shownTotal) ? shownTotal : total, total, 900, function (v) {
    shownTotal = v;
    var n = Math.round(v);
    P2C.text(tot, P2C.fmtNum(n) + (n === 1 ? " vote" : " votes"));
  });
});
</script>
