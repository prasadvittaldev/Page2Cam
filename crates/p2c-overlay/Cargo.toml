[package]
name = "p2c-overlay"
edition.workspace = true
version.workspace = true
license.workspace = true

# Overlay layers (titles, tickers, HTML, images, video, YouTube) drawn over
# the output by a transparent second browser: the layer model, validation,
# persistence, asset storage and the scene page. Platform-free.
[dependencies]
anyhow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.9"

[dev-dependencies]
tempfile.workspace = true
