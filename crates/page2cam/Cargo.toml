[package]
name = "page2cam"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
p2c-core.workspace = true
p2c-compositor.workspace = true
p2c-d3d.workspace = true
p2c-vcam.workspace = true
p2c-browser.workspace = true
p2c-webcam.workspace = true
p2c-audio.workspace = true
p2c-stream.workspace = true
p2c-admin.workspace = true
p2c-segment.workspace = true
p2c-update.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
directories = "5"
ctrlc = { version = "3", features = ["termination"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_Recovery",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
] }

[dev-dependencies]
tempfile.workspace = true
