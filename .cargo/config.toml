# Windows: link the C runtime statically so page2cam.exe and the camera DLL
# don't need the VC++ redistributable (VCRUNTIME140.dll) on the target PC.
# CEF's libcef_dll_wrapper is also built /MT (static CRT), so this matches it.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
